<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bootstrap 5 – 90 Components × 2 Designs</title>
  <link rel="stylesheet" href="./bootstrabfile/bootstrap.min.css" />
  <style>
    body {
      background: #f4f6f9
    }

    .side {
      position: sticky;
      top: 76px;
      max-height: calc(100vh - 96px);
      overflow: auto
    }

    .side .list-group-item {
      border: 0;
      border-radius: 8px !important;
      margin-bottom: 1px;
      padding: .35rem .75rem;
      font-size: 14px
    }

    .side .gh {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #6c757d;
      padding: 12px 8px 4px
    }

    .demo {
      background: #fff;
      border: 1px solid #e3e6ea;
      border-radius: 8px;
      padding: 18px;
      overflow: auto
    }

    pre {
      background: #f1f3f5;
      padding: 12px;
      border-radius: 8px;
      white-space: pre-wrap;
      font-size: 12.5px;
      margin: 0
    }

    .grad {
      background: linear-gradient(90deg, #6610f2, #0d6efd)
    }
  </style>
</head>

<body>
  <nav class="navbar bg-white border-bottom sticky-top">
    <div class="container-xl">
      <span class="navbar-brand fw-bold mb-0">Bootstrap 5 – 90 Components</span>
      <input id="q" class="form-control" style="max-width:260px" placeholder="🔍 Search component">
    </div>
  </nav>
  <div class="container-xl py-4">
    <div class="row g-4">
      <div class="col-lg-3">
        <div class="side">
          <div id="toc" class="list-group"></div>
        </div>
      </div>
      <div class="col-lg-9">
        <h3 id="title" class="mb-3"></h3>
        <div id="out"></div>
      </div>
    </div>
  </div>
  <script>
    const CO = ["primary", "secondary", "success", "danger", "warning", "info", "light", "dark"];
    const B = (c, t, x = "") => `<button class="btn btn-${c} ${x}">${t}</button>`;
    const PH = h => `<div class="bg-secondary bg-opacity-25 rounded" style="height:${h}px"></div>`;
    const AL = (c, t, x = "") => `<div class="alert alert-${c} ${x}">${t}</div>`;
    const LI = ["Home", "Features", "Pricing"].map((t, i) => `<li class="nav-item"><a class="nav-link${i ? "" : " active"}" href="#">${t}</a></li>`).join("");
    const ACC = (c, p) => `<div class="accordion ${c}" id="@@">` + [1, 2, 3].map(i => `<div class="accordion-item"><h2 class="accordion-header"><button class="accordion-button${i > 1 ? " collapsed" : ""}" data-bs-toggle="collapse" data-bs-target="#@@-${i}">Item ${i}</button></h2><div id="@@-${i}" class="accordion-collapse collapse${i == 1 ? " show" : ""}" ${p ? 'data-bs-parent="#@@"' : ""}><div class="accordion-body">Body ${i}</div></div></div>`).join("") + "</div>";
    const NB = (c, e = "") => `<nav class="navbar navbar-expand-lg ${c}"><div class="container-fluid"><a class="navbar-brand" href="#">Brand</a><button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#@@"><span class="navbar-toggler-icon"></span></button><div class="collapse navbar-collapse" id="@@"><ul class="navbar-nav me-auto">${LI}</ul>${e}</div></div></nav>`;
    const M = (h, b, d = "", c = "") => `<button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#@@">Open</button><div class="modal fade" id="@@" tabindex="-1"><div class="modal-dialog ${d}"><div class="modal-content ${c}"><div class="modal-header"><h5 class="modal-title">${h}</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">${b}</div></div></div></div>`;
    const OC = p => `<button class="btn btn-dark" data-bs-toggle="offcanvas" data-bs-target="#@@">Open ${p}</button><div class="offcanvas offcanvas-${p}" id="@@"><div class="offcanvas-header"><h5>Menu</h5><button class="btn-close" data-bs-dismiss="offcanvas"></button></div><div class="offcanvas-body">Content</div></div>`;
    const CR = (f, i) => `<div id="@@" class="carousel slide ${f}" data-bs-ride="carousel">${i ? `<div class="carousel-indicators">${[0, 1, 2].map(n => `<button data-bs-target="#@@" data-bs-slide-to="${n}" class="${n ? "" : "active"}"></button>`).join("")}</div>` : ""}<div class="carousel-inner">${["primary", "success", "danger"].map((c, n) => `<div class="carousel-item${n ? "" : " active"} bg-${c} text-white text-center py-5"><h3>Slide ${n + 1}</h3><p>Caption</p></div>`).join("")}</div><button class="carousel-control-prev" data-bs-target="#@@" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button><button class="carousel-control-next" data-bs-target="#@@" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button></div>`;
    const TB = (t) => `<ul class="nav nav-${t} mb-2"><li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#@@a">Home</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#@@b">Profile</button></li></ul><div class="tab-content"><div class="tab-pane fade show active" id="@@a">Home content</div><div class="tab-pane fade" id="@@b">Profile content</div></div>`;
    const FI = (l, i) => `<label class="form-label">${l}</label>${i}`;
    const T = (h = 1) => `<table class="table @@t"><thead><tr><th>#</th><th>Name</th><th>Role</th></tr></thead><tbody><tr><td>1</td><td>Ravi</td><td>Dev</td></tr><tr><td>2</td><td>Kumar</td><td>QA</td></tr></tbody></table>`;
    const ST = (c, n, t) => `<div class="card border-0 shadow-sm"><div class="card-body d-flex align-items-center gap-3"><div class="fs-1">${c}</div><div><small class="text-muted">${t}</small><h3 class="mb-0">${n}</h3></div></div></div>`;
    const SB = (c) => `<div class="d-flex flex-column p-3 ${c}" style="width:210px;min-height:260px"><span class="fs-5 fw-bold mb-3">Admin</span><ul class="nav nav-pills flex-column gap-1"><li><a class="nav-link active" href="#">🏠 Home</a></li><li><a class="nav-link ${c.includes("dark") ? "text-white" : ""}" href="#">📊 Reports</a></li><li><a class="nav-link ${c.includes("dark") ? "text-white" : ""}" href="#">👥 Users</a></li><li><a class="nav-link ${c.includes("dark") ? "text-white" : ""}" href="#">⚙ Settings</a></li></ul></div>`;
    const BX = (c, t) => `<div class="p-2 border bg-${c} bg-opacity-25 text-center">${t}</div>`;
    const C = [
      ["Accordion", [ACC("", 1), ACC("accordion-flush", 0)]],
      ["Alerts", [AL("success", "✔ Saved") + AL("danger", "✖ Error"), AL("warning", '⚠ Dismissible<button class="btn-close" data-bs-dismiss="alert"></button>', "alert-dismissible")]],
      ["Badges", [CO.map(c => `<span class="badge bg-${c}">${c}</span>`).join(" "), '<button class="btn btn-primary position-relative">Inbox<span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">9+</span></button> <span class="badge rounded-pill text-bg-success">Pill</span>']],
      ["Breadcrumb", ['<ol class="breadcrumb"><li class="breadcrumb-item"><a href="#">Home</a></li><li class="breadcrumb-item"><a href="#">Library</a></li><li class="breadcrumb-item active">Data</li></ol>', '<ol class="breadcrumb bg-light p-2 rounded" style="--bs-breadcrumb-divider:\'>\'"><li class="breadcrumb-item"><a href="#">Home</a></li><li class="breadcrumb-item active">Page</li></ol>']],
      ["Buttons", [CO.map(c => B(c, c)).join(" "), CO.slice(0, 6).map(c => B("outline-" + c, c)).join(" ")]],
      ["Button Group", ['<div class="btn-group">' + B("dark", "Left") + B("dark", "Mid") + B("dark", "Right") + '</div>', '<div class="btn-group-vertical">' + B("primary", "Top") + B("primary", "Middle") + B("primary", "Bottom") + '</div>']],
      ["Cards", [`<div class="card" style="max-width:18rem">${PH(110)}<div class="card-body"><h5 class="card-title">Title</h5><p class="card-text">Text</p>${B("primary", "Go")}</div></div>`, `<div class="card"><div class="row g-0"><div class="col-4 bg-primary"></div><div class="col-8 card-body"><h5>Horizontal</h5><p class="mb-0">Text</p></div></div></div>`]],
      ["Carousel / Slider", [CR("", 0), CR("carousel-fade", 1)]],
      ["Close Button", ['<button class="btn-close"></button> <button class="btn-close" disabled></button>', '<div class="bg-dark p-3"><button class="btn-close btn-close-white"></button></div>']],
      ["Collapse", [`${B("primary", "Toggle").replace("<button", '<button data-bs-toggle="collapse" data-bs-target="#@@"')}<div class="collapse mt-2" id="@@"><div class="card card-body">Hidden content</div></div>`, `<button class="btn btn-dark" data-bs-toggle="collapse" data-bs-target=".m@@">Toggle both</button><div class="row mt-2"><div class="col"><div class="collapse m@@"><div class="card card-body">One</div></div></div><div class="col"><div class="collapse m@@"><div class="card card-body">Two</div></div></div></div>`]],
      ["Dropdown", ['<div class="dropdown"><button class="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown">Menu</button><ul class="dropdown-menu"><li><a class="dropdown-item" href="#">Action</a></li><li><hr class="dropdown-divider"></li><li><a class="dropdown-item" href="#">Other</a></li></ul></div>', '<div class="btn-group dropend"><button class="btn btn-dark dropdown-toggle" data-bs-toggle="dropdown">Dark end</button><ul class="dropdown-menu dropdown-menu-dark"><li><a class="dropdown-item active" href="#">One</a></li><li><a class="dropdown-item" href="#">Two</a></li></ul></div>']],
      ["List Group", ['<ul class="list-group"><li class="list-group-item active">Active</li><li class="list-group-item">Item</li><li class="list-group-item disabled">Disabled</li></ul>', '<ul class="list-group list-group-flush"><li class="list-group-item d-flex justify-content-between">Inbox <span class="badge bg-primary rounded-pill">14</span></li><li class="list-group-item d-flex justify-content-between">Sent <span class="badge bg-secondary rounded-pill">2</span></li></ul>']],
      ["Modal", [M("Basic", "Modal body"), M("Centered scrollable", "<p>Long text</p>".repeat(25), "modal-dialog-centered modal-dialog-scrollable")]],
      ["Navbar", [NB("bg-light", `<form class="d-flex"><input class="form-control me-2" placeholder="Search">${B("outline-success", "Go")}</form>`), NB("navbar-dark bg-dark", B("warning", "Login"))]],
      ["Navs & Tabs", [TB("tabs"), TB("pills")]],
      ["Offcanvas / Sidebar", [OC("start"), OC("bottom")]],
      ["Pagination", ['<ul class="pagination">' + ["«", 1, 2, 3, "»"].map((n, i) => `<li class="page-item${i == 2 ? " active" : ""}"><a class="page-link" href="#">${n}</a></li>`).join("") + '</ul>', '<ul class="pagination pagination-lg justify-content-center">' + [1, 2, 3].map(n => `<li class="page-item"><a class="page-link rounded-pill mx-1" href="#">${n}</a></li>`).join("") + '</ul>']],
      ["Placeholders / Skeleton Loading", ['<p class="placeholder-glow"><span class="placeholder col-7"></span><span class="placeholder col-4"></span><span class="placeholder col-10"></span></p>', '<p class="placeholder-wave"><span class="placeholder col-12 bg-primary"></span><span class="placeholder col-6 placeholder-lg"></span></p>']],
      ["Popovers", [B("danger", "Click me").replace("<button", '<button data-bs-toggle="popover" title="Title" data-bs-content="Popover content"'), B("secondary", "Hover (right)").replace("<button", '<button data-bs-toggle="popover" data-bs-trigger="hover focus" data-bs-placement="right" data-bs-content="Right side"')]],
      ["Progress Bars", ['<div class="progress mb-2"><div class="progress-bar" style="width:25%">25%</div></div><div class="progress"><div class="progress-bar bg-success" style="width:70%"></div></div>', '<div class="progress"><div class="progress-bar progress-bar-striped progress-bar-animated" style="width:40%"></div><div class="progress-bar bg-warning" style="width:30%"></div><div class="progress-bar bg-danger" style="width:15%"></div></div>']],
      ["Scrollspy", [`<div id="@@" class="list-group mb-2"><a class="list-group-item list-group-item-action" href="#@@1">Item 1</a><a class="list-group-item list-group-item-action" href="#@@2">Item 2</a></div><div data-bs-spy="scroll" data-bs-target="#@@" style="height:80px;overflow:auto;position:relative"><h5 id="@@1">Item 1</h5><p style="height:90px">Text</p><h5 id="@@2">Item 2</h5><p style="height:90px">Text</p></div>`, `<nav id="@@" class="nav nav-pills mb-2"><a class="nav-link" href="#@@1">One</a><a class="nav-link" href="#@@2">Two</a></nav><div data-bs-spy="scroll" data-bs-target="#@@" style="height:80px;overflow:auto;position:relative"><h5 id="@@1">One</h5><p style="height:90px">Text</p><h5 id="@@2">Two</h5><p style="height:90px">Text</p></div>`]],
      ["Spinners / Loading", [CO.slice(0, 6).map(c => `<div class="spinner-border text-${c}"></div>`).join(" "), CO.slice(0, 6).map(c => `<div class="spinner-grow text-${c}"></div>`).join(" ") + ' <div class="spinner-border spinner-border-sm"></div>']],
      ["Toasts / Notifications", ['<div class="toast show"><div class="toast-header"><strong class="me-auto">Title</strong><small>now</small><button class="btn-close" data-bs-dismiss="toast"></button></div><div class="toast-body">Hello toast!</div></div>', '<div class="toast show align-items-center text-bg-primary border-0"><div class="d-flex"><div class="toast-body">Colored toast</div><button class="btn-close btn-close-white m-auto me-2" data-bs-dismiss="toast"></button></div></div>']],
      ["Tooltips", ["top,right,bottom,left".split(",").map(p => B("secondary", p).replace("<button", `<button data-bs-toggle="tooltip" data-bs-placement="${p}" title="Tooltip ${p}"`)).join(" "), '<a href="#" data-bs-toggle="tooltip" title="Link tooltip">Hover link</a> <span data-bs-toggle="tooltip" data-bs-html="true" title="<b>Bold</b> HTML" class="badge bg-dark">HTML tip</span>']],
      ["Form Controls", [FI("Email", '<input class="form-control" placeholder="name@example.com">') + FI("Text", '<textarea class="form-control" rows="2"></textarea>'), '<input class="form-control form-control-lg mb-2" placeholder="Large"><input class="form-control form-control-sm" placeholder="Small">']],
      ["Input", ['<input type="text" class="form-control mb-2" placeholder="Text"><input type="email" class="form-control mb-2" placeholder="Email"><input type="password" class="form-control" placeholder="Password">', '<input class="form-control mb-2" value="Disabled" disabled><input class="form-control-plaintext" readonly value="Plain readonly">']],
      ["Textarea", ['<textarea class="form-control" rows="3" placeholder="Message"></textarea>', '<div class="form-floating"><textarea class="form-control" style="height:100px" placeholder="x"></textarea><label>Comments</label></div>']],
      ["Select", ['<select class="form-select"><option>Choose…</option><option>One</option><option>Two</option></select>', '<select class="form-select" multiple size="3"><option>One</option><option>Two</option><option>Three</option></select>']],
      ["Checkbox", ['<div class="form-check"><input class="form-check-input" type="checkbox" checked><label class="form-check-label">Checked</label></div><div class="form-check"><input class="form-check-input" type="checkbox"><label class="form-check-label">Default</label></div>', '<div class="form-check form-check-inline"><input class="form-check-input" type="checkbox"><label class="form-check-label">A</label></div><div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" disabled><label class="form-check-label">Disabled</label></div>']],
      ["Radio Button", ['<div class="form-check"><input class="form-check-input" type="radio" name="r@@" checked><label class="form-check-label">One</label></div><div class="form-check"><input class="form-check-input" type="radio" name="r@@"><label class="form-check-label">Two</label></div>', '<input type="radio" class="btn-check" name="b@@" id="a@@" checked><label class="btn btn-outline-primary" for="a@@">Yes</label> <input type="radio" class="btn-check" name="b@@" id="b@@"><label class="btn btn-outline-primary" for="b@@">No</label>']],
      ["Switch", ['<div class="form-check form-switch"><input class="form-check-input" type="checkbox" checked><label class="form-check-label">Notifications</label></div>', '<div class="form-check form-switch fs-3"><input class="form-check-input" type="checkbox"><label class="form-check-label fs-6">Large switch</label></div>']],
      ["Range Slider", ['<input type="range" class="form-range">', '<label class="form-label">Min 0 Max 5 Step .5</label><input type="range" class="form-range" min="0" max="5" step="0.5">']],
      ["Input Group", ['<div class="input-group"><span class="input-group-text">@</span><input class="form-control" placeholder="Username"></div>', '<div class="input-group"><input class="form-control" placeholder="Search">' + B("primary", "Go") + '</div>']],
      ["Floating Labels", ['<div class="form-floating"><input class="form-control" placeholder="e"><label>Email</label></div>', '<div class="form-floating"><select class="form-select"><option>One</option><option>Two</option></select><label>Choose</label></div>']],
      ["Form Validation", ['<input class="form-control is-valid mb-1" value="Good"><div class="valid-feedback d-block">Looks good!</div>', '<input class="form-control is-invalid"><div class="invalid-feedback d-block">Required field</div>']],
      ["File Input", ['<input type="file" class="form-control">', '<input type="file" class="form-control form-control-sm mb-2" multiple><input type="file" class="form-control" disabled>']],
      ["Color Picker", ['<input type="color" class="form-control form-control-color" value="#0d6efd">', '<label class="form-label">Pick color</label><input type="color" class="form-control form-control-color" value="#dc3545" title="Choose">']],
      ["Date/Time Input", ['<input type="date" class="form-control mb-2"><input type="time" class="form-control">', '<input type="datetime-local" class="form-control mb-2"><input type="month" class="form-control">']],
      ["Container", ['<div class="container border bg-primary bg-opacity-25 py-2 text-center">.container (fixed max-width, centered)</div>', '<div class="container-fluid border bg-info bg-opacity-25 py-2 text-center">.container-fluid (100% width)</div>']],
      ["Grid / Rows / Columns", ['<div class="row">' + ["col", "col", "col"].map(t => `<div class="col">${BX("primary", t)}</div>`).join("") + '</div>', '<div class="row"><div class="col-8">' + BX("success", "col-8") + '</div><div class="col-4">' + BX("danger", "col-4") + '</div></div>']],
      ["Responsive Breakpoints", ['<div class="row"><div class="col-12 col-md-6 col-lg-3">' + BX("primary", "12/6/3") + '</div><div class="col-12 col-md-6 col-lg-3">' + BX("primary", "12/6/3") + '</div><div class="col-12 col-md-6 col-lg-3">' + BX("primary", "12/6/3") + '</div><div class="col-12 col-md-6 col-lg-3">' + BX("primary", "12/6/3") + '</div></div>', '<div class="d-none d-md-block bg-success text-white p-2">Visible md+</div><div class="d-md-none bg-danger text-white p-2">Visible below md</div>']],
      ["Stack", ['<div class="vstack gap-2"><div class="p-2 border">One</div><div class="p-2 border">Two</div></div>', '<div class="hstack gap-3"><div class="p-2 border">A</div><div class="p-2 border ms-auto">B</div><div class="vr"></div><div class="p-2 border">C</div></div>']],
      ["Gutters", ['<div class="row g-1"><div class="col">' + BX("primary", "g-1") + '</div><div class="col">' + BX("primary", "g-1") + '</div></div>', '<div class="row g-5"><div class="col">' + BX("danger", "g-5") + '</div><div class="col">' + BX("danger", "g-5") + '</div></div>']],
      ["Vertical Alignment", ['<div class="row align-items-center border" style="height:100px"><div class="col">' + BX("info", "center") + '</div><div class="col">' + BX("info", "center") + '</div></div>', '<div class="row border" style="height:100px"><div class="col align-self-start">' + BX("info", "start") + '</div><div class="col align-self-end">' + BX("info", "end") + '</div></div>']],
      ["Horizontal Alignment", ['<div class="row justify-content-center"><div class="col-4">' + BX("success", "center") + '</div></div>', '<div class="row justify-content-between"><div class="col-3">' + BX("success", "L") + '</div><div class="col-3">' + BX("success", "R") + '</div></div>']],
      ["Colors", [CO.map(c => `<span class="text-${c} me-2">${c}</span>`).join(""), CO.map(c => `<span class="badge text-bg-${c}">${c}</span>`).join(" ")]],
      ["Backgrounds", [CO.slice(0, 6).map(c => `<div class="bg-${c} text-white p-2 mb-1">bg-${c}</div>`).join(""), '<div class="bg-primary bg-gradient text-white p-2 mb-1">gradient</div><div class="bg-danger bg-opacity-25 p-2 mb-1">opacity 25</div><div class="bg-body-secondary p-2">body-secondary</div>']],
      ["Borders", ['<div class="d-flex gap-2 text-center">' + ["border", "border-top", "border-end", "border-bottom", "border-start"].map(c => `<div class="${c} p-3 flex-fill">${c}</div>`).join("") + '</div>', '<div class="border border-4 border-danger p-2 mb-2">border-4 danger</div><div class="border border-success border-opacity-25 p-2">opacity 25</div>']],
      ["Border Radius", ['<div class="d-flex gap-2">' + [0, 1, 2, 3, 4, 5].map(n => `<div class="bg-primary text-white p-3 rounded-${n}">${n}</div>`).join("") + '</div>', '<div class="d-flex gap-2"><div class="bg-dark rounded-circle" style="width:60px;height:60px"></div><div class="bg-dark text-white rounded-pill px-4 py-3">pill</div><div class="bg-dark text-white rounded-top-4 p-3">top</div></div>']],
      ["Shadows", ['<div class="shadow-sm p-3 mb-3">shadow-sm</div><div class="shadow p-3 mb-3">shadow</div><div class="shadow-lg p-3">shadow-lg</div>', '<div class="shadow-none p-3 bg-light">shadow-none</div>']],
      ["Spacing — margin/padding", ['<div class="bg-warning"><div class="bg-white m-3 p-4">m-3 p-4</div></div>', '<div class="bg-warning"><div class="bg-white mx-auto my-2 px-5 py-1 w-50 text-center">mx-auto px-5 py-1</div></div>']],
      ["Display", ['<span class="d-inline bg-info p-2">inline</span><span class="d-inline-block bg-success p-2">inline-block</span><div class="d-block bg-warning p-2">block</div>', '<div class="d-flex gap-2"><div class="d-none d-sm-block p-2 border">sm+</div><div class="d-none d-lg-block p-2 border">lg+</div></div>']],
      ["Position", ['<div class="position-relative bg-light border" style="height:90px"><span class="position-absolute top-0 start-0 badge bg-dark">top-start</span><span class="position-absolute bottom-0 end-0 badge bg-danger">bottom-end</span><span class="position-absolute top-50 start-50 translate-middle badge bg-primary">center</span></div>', '<div class="position-relative bg-light border" style="height:90px"><div class="sticky-top bg-warning p-1">sticky-top</div></div>']],
