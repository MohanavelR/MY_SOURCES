<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bootstrap 5 – All Classes with Examples</title>
<link rel="stylesheet" href="./bootstrabfile/bootstrap.min.css" />
<style>pre{background:#212529;color:#9fe;padding:10px;border-radius:6px;white-space:pre-wrap;font-size:12px;margin:0}
.demo{border:1px dashed #adb5bd;padding:12px;border-radius:6px;overflow:auto}
.sticky-top{z-index:5}</style>
</head>
<body class="bg-light">
<div class="container py-4">
  <h1 class="text-center">Bootstrap 5 – All Classes (Name + Explanation + Example)</h1>
  <div class="sticky-top bg-light py-2"><input id="q" class="form-control" placeholder="Search class name... (e.g. btn, flex, mt-)"></div>
  <div class="my-2" id="toc"></div>
  <div id="out"></div>
</div>
<script>
const box=(c,t)=>`<div class="${c}">${t}</div>`;
const S={
"Layout & Grid":[
["container / container-fluid","Centered fixed-width wrapper / full-width wrapper",box("container bg-white border","container")+box("container-fluid bg-white border mt-1","container-fluid")],
["row + col-*","12-column grid. col-6 = half width, col-md-4 = 1/3 from md screens up",'<div class="row"><div class="col-6 border">col-6</div><div class="col-3 border">col-3</div><div class="col-3 border">col-3</div></div>'],
["col-sm / col-md / col-lg / col-xl / col-xxl","Responsive breakpoints: 576 / 768 / 992 / 1200 / 1400 px",'<div class="row"><div class="col-12 col-md-6 border">12 → 6</div><div class="col-12 col-md-6 border">12 → 6</div></div>'],
["g-* / gx-* / gy-*","Gutter (gap) between columns",'<div class="row g-3"><div class="col border">g-3</div><div class="col border">g-3</div></div>'],
["offset-* / ms-auto","Push a column right",'<div class="row"><div class="col-4 offset-4 border">offset-4</div></div>'],
["row-cols-*","Set columns per row",'<div class="row row-cols-3"><div class="col border">1</div><div class="col border">2</div><div class="col border">3</div><div class="col border">4</div></div>']],
"Spacing":[
["m-* p-* (0–5, auto)","Margin / padding. Scale: 0=0, 1=.25rem, 2=.5rem, 3=1rem, 4=1.5rem, 5=3rem",'<div class="bg-warning p-4">p-4</div><div class="bg-info m-4">m-4</div>'],
["mt mb ms me mx my / pt pb ps pe px py","t=top b=bottom s=start(left) e=end(right) x=left+right y=top+bottom",'<div class="bg-success text-white px-5 py-1">px-5 py-1</div>'],
["gap-*","Space between flex/grid children",'<div class="d-flex gap-4"><span class="border">A</span><span class="border">B</span></div>']],
"Text & Typography":[
["h1–h6 / display-1…6","Heading style on any element / large display heading",'<p class="h2">h2 look</p><p class="display-6">display-6</p>'],
["lead / small / mark / fw-bold / fst-italic","Lead paragraph, small text, highlight, bold, italic",'<p class="lead">lead</p><small>small</small> <mark>mark</mark> <b class="fw-bold">bold</b> <i class="fst-italic">italic</i>'],
["text-start / center / end","Text alignment",'<p class="text-center border">center</p><p class="text-end border">end</p>'],
["text-uppercase / lowercase / capitalize","Text transform",'<p class="text-uppercase">upper case</p>'],
["text-decoration-none / underline / line-through","Decoration",'<a href="#" class="text-decoration-none">no underline</a> <span class="text-decoration-line-through">removed</span>'],
["text-truncate / text-wrap / text-nowrap","Cut with … / wrap / no wrap",'<div class="text-truncate" style="width:120px">Very long text that is cut</div>'],
["fs-1…6 / fw-light / lh-*","Font size, weight, line height",'<span class="fs-2">fs-2</span> <span class="fw-light">light</span>'],
["blockquote","Quote block",'<blockquote class="blockquote"><p>A quote.</p></blockquote>'],
["list-unstyled / list-inline","Remove bullets / horizontal list",'<ul class="list-unstyled"><li>One</li><li>Two</li></ul>']],
"Colors & Background":[
["text-primary / secondary / success / danger / warning / info / light / dark / muted / white","Text color",["primary","secondary","success","danger","warning","info","dark","muted"].map(c=>`<span class="text-${c} me-2">${c}</span>`).join("")],
["bg-primary … bg-dark / bg-gradient","Background color",["primary","secondary","success","danger","warning","info","light","dark"].map(c=>`<span class="badge bg-${c}">bg-${c}</span>`).join(" ")+'<div class="bg-primary bg-gradient p-2 mt-2 text-white">bg-gradient</div>'],
["bg-opacity-* / text-opacity-*","Transparency 10,25,50,75,100",'<div class="bg-danger bg-opacity-25 p-2">bg-opacity-25</div>'],
["link-primary … link-dark","Colored links",'<a href="#" class="link-success">link-success</a>']],
"Display, Flex & Position":[
["d-none / d-block / d-inline / d-inline-block / d-flex / d-grid","Display type. Use d-md-none etc. for responsive hide/show",'<div class="d-none d-md-block bg-info p-2">Visible from md up</div>'],
["flex-row / flex-column / flex-wrap / flex-fill / flex-grow-1","Flex direction and sizing",'<div class="d-flex flex-column gap-1"><div class="border">1</div><div class="border">2</div></div>'],
["justify-content-start / center / end / between / around / evenly","Main-axis alignment",'<div class="d-flex justify-content-between border p-1"><span>L</span><span>R</span></div>'],
["align-items-start / center / end / stretch / baseline","Cross-axis alignment",'<div class="d-flex align-items-center border" style="height:70px"><span>centered</span></div>'],
["align-self-* / order-* / ms-auto","Single item align / reorder / push",'<div class="d-flex"><span class="order-2">A(2)</span><span class="order-1">B(1)</span></div>'],
["position-relative / absolute / fixed / sticky","Positioning; use top-0 start-0 end-0 bottom-0 translate-middle",'<div class="position-relative bg-light border" style="height:70px"><span class="position-absolute top-0 end-0 badge bg-danger">corner</span></div>'],
["fixed-top / fixed-bottom / sticky-top","Stick to viewport top/bottom",'<code>&lt;nav class="navbar fixed-top"&gt;</code>'],
["visible / invisible / visually-hidden","Show/hide keeping layout / screen-reader only",'<span class="invisible">hidden</span><span class="visually-hidden">sr only</span>visible'],
["overflow-auto / hidden / visible / scroll","Overflow control",'<div class="overflow-auto border" style="height:50px">Line<br>Line<br>Line<br>Line</div>'],
["float-start / float-end / clearfix","Float",'<div class="clearfix"><span class="float-end badge bg-dark">right</span></div>'],
["ratio ratio-16x9 / 4x3 / 1x1","Aspect ratio box",'<div class="ratio ratio-16x9 bg-dark text-white"><div class="d-flex justify-content-center align-items-center">16x9</div></div>']],
"Sizing, Border, Shadow":[
["w-25 / 50 / 75 / 100 / auto, h-*","Width & height percent",'<div class="w-50 bg-secondary text-white">w-50</div>'],
["mw-100 / mh-100 / vw-100 / vh-100","Max width/height, viewport width/height",'<code>vh-100 = full screen height</code>'],
["border / border-top / border-0 / border-2 / border-primary","Border sides, width, color",'<div class="border border-3 border-danger p-2">border-3 border-danger</div>'],
["rounded / rounded-circle / rounded-pill / rounded-0…5","Corner radius",'<span class="bg-primary text-white p-2 rounded-pill">pill</span> <span class="bg-dark d-inline-block rounded-circle" style="width:40px;height:40px"></span>'],
["shadow-none / shadow-sm / shadow / shadow-lg","Box shadow",'<div class="shadow p-3 bg-white">shadow</div>'],
["opacity-25 / 50 / 75 / 100","Element opacity",'<div class="bg-dark text-white p-2 opacity-50">opacity-50</div>'],
["vr / hr","Vertical rule / horizontal rule",'<div class="d-flex"><span>A</span><div class="vr mx-2"></div><span>B</span></div>']],
"Buttons":[
["btn btn-{color}","Solid button: primary secondary success danger warning info light dark link",["primary","secondary","success","danger","warning","info","light","dark","link"].map(c=>`<button class="btn btn-${c}">${c}</button>`).join(" ")],
["btn btn-outline-{color}","Outline button",["primary","success","danger","dark"].map(c=>`<button class="btn btn-outline-${c}">${c}</button>`).join(" ")],
["btn-lg / btn-sm / w-100 / d-grid","Sizes and block button",'<button class="btn btn-primary btn-lg">Large</button> <button class="btn btn-primary btn-sm">Small</button>'],
["disabled / active","States",'<button class="btn btn-primary" disabled>disabled</button> <button class="btn btn-primary active">active</button>'],
["btn-group / btn-group-vertical / btn-toolbar","Group buttons",'<div class="btn-group"><button class="btn btn-dark">1</button><button class="btn btn-dark">2</button></div>'],
["btn-close","X close button",'<button class="btn-close"></button>']],
"Alerts, Badges, Progress, Spinners":[
["alert alert-{color} / alert-dismissible / alert-link / alert-heading","Message box",'<div class="alert alert-warning alert-dismissible">Warning! <button class="btn-close" data-bs-dismiss="alert"></button></div>'],
["badge bg-{color} / rounded-pill","Small label/counter",'<span class="badge bg-danger">4</span> <span class="badge rounded-pill bg-success">pill</span>'],
["progress / progress-bar / striped / animated","Progress bar",'<div class="progress"><div class="progress-bar progress-bar-striped progress-bar-animated" style="width:60%">60%</div></div>'],
["spinner-border / spinner-grow / spinner-*-sm","Loading indicator",'<div class="spinner-border text-primary"></div> <div class="spinner-grow text-danger"></div>'],
["placeholder / placeholder-glow","Skeleton loading",'<p class="placeholder-glow"><span class="placeholder col-6"></span></p>']],
"Cards, List group, Table":[
["card / card-body / card-title / card-text / card-header / card-footer / card-img-top","Content card",'<div class="card" style="width:14rem"><div class="card-header">Header</div><div class="card-body"><h5 class="card-title">Title</h5><p class="card-text">Text</p></div><div class="card-footer">Footer</div></div>'],
["list-group / list-group-item / active / list-group-flush / list-group-horizontal","List",'<ul class="list-group"><li class="list-group-item active">Active</li><li class="list-group-item">Item</li></ul>'],
["table / table-striped / table-hover / table-bordered / table-dark / table-sm / table-responsive","Table styles",'<table class="table table-striped table-hover"><thead><tr><th>#</th><th>Name</th></tr></thead><tbody><tr><td>1</td><td>A</td></tr><tr><td>2</td><td>B</td></tr></tbody></table>'],
["table-{color} (tr/td)","Row/cell color",'<table class="table"><tr class="table-danger"><td>danger</td></tr><tr class="table-info"><td>info</td></tr></table>']],
"Forms":[
["form-control / form-label / form-text","Text input",'<label class="form-label">Email</label><input class="form-control" placeholder="name@example.com"><div class="form-text">Help text</div>'],
["form-select","Dropdown select",'<select class="form-select"><option>One</option><option>Two</option></select>'],
["form-check / form-check-input / form-switch","Checkbox, radio, switch",'<div class="form-check"><input class="form-check-input" type="checkbox"><label class="form-check-label">Check</label></div><div class="form-check form-switch"><input class="form-check-input" type="checkbox"><label class="form-check-label">Switch</label></div>'],
["form-range","Slider",'<input type="range" class="form-range">'],
["input-group / input-group-text","Prepend/append addon",'<div class="input-group"><span class="input-group-text">@</span><input class="form-control"></div>'],
["form-floating","Floating label",'<div class="form-floating"><input class="form-control" placeholder="x"><label>Floating</label></div>'],
["form-control-lg / -sm / -plaintext / -color","Input sizes/variants",'<input class="form-control form-control-lg" placeholder="large">'],
["is-valid / is-invalid / valid-feedback / invalid-feedback","Validation",'<input class="form-control is-invalid"><div class="invalid-feedback d-block">Required</div>'],
["disabled / readonly","States",'<input class="form-control" disabled placeholder="disabled">']],
"Navigation":[
["nav / nav-item / nav-link / nav-tabs / nav-pills / nav-fill / justify-content-*","Tabs & pills",'<ul class="nav nav-tabs"><li class="nav-item"><a class="nav-link active" href="#">Active</a></li><li class="nav-item"><a class="nav-link" href="#">Link</a></li></ul><ul class="nav nav-pills mt-2"><li class="nav-item"><a class="nav-link active" href="#">Pill</a></li><li class="nav-item"><a class="nav-link" href="#">Pill</a></li></ul>'],
["navbar / navbar-brand / navbar-nav / navbar-toggler / navbar-expand-lg / navbar-text","Top menu bar",'<nav class="navbar navbar-expand bg-dark navbar-dark px-3"><a class="navbar-brand" href="#">Brand</a><ul class="navbar-nav"><li class="nav-item"><a class="nav-link active" href="#">Home</a></li></ul></nav>'],
["breadcrumb / breadcrumb-item","Path trail",'<ol class="breadcrumb"><li class="breadcrumb-item"><a href="#">Home</a></li><li class="breadcrumb-item active">Page</li></ol>'],
["pagination / page-item / page-link / pagination-lg / -sm","Page numbers",'<ul class="pagination"><li class="page-item"><a class="page-link" href="#">1</a></li><li class="page-item active"><a class="page-link" href="#">2</a></li></ul>'],
["dropdown / dropdown-toggle / dropdown-menu / dropdown-item / dropdown-divider / dropup / dropend / dropstart","Dropdown menu",'<div class="dropdown"><button class="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown">Menu</button><ul class="dropdown-menu"><li><a class="dropdown-item" href="#">Action</a></li><li><hr class="dropdown-divider"></li><li><a class="dropdown-item" href="#">Other</a></li></ul></div>']],
"Components (JS)":[
["accordion / accordion-item / -button / -collapse / -body / accordion-flush","Expand/collapse panels",'<div class="accordion"><div class="accordion-item"><h2 class="accordion-header"><button class="accordion-button" data-bs-toggle="collapse" data-bs-target="#a1">Item</button></h2><div id="a1" class="accordion-collapse collapse show"><div class="accordion-body">Body</div></div></div></div>'],
["collapse / collapsing / show","Toggle content",'<button class="btn btn-primary" data-bs-toggle="collapse" data-bs-target="#c1">Toggle</button><div class="collapse mt-2" id="c1"><div class="card card-body">Hidden text</div></div>'],
["modal / modal-dialog / -content / -header / -body / -footer / modal-lg / modal-dialog-centered / modal-fullscreen","Popup dialog",'<button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#m1">Open</button><div class="modal fade" id="m1"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Title</h5><button class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">Body</div><div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Close</button></div></div></div></div>'],
["offcanvas / offcanvas-start / -end / -top / -bottom / -header / -body","Side drawer",'<button class="btn btn-dark" data-bs-toggle="offcanvas" data-bs-target="#o1">Drawer</button><div class="offcanvas offcanvas-start" id="o1"><div class="offcanvas-header"><h5>Menu</h5><button class="btn-close" data-bs-dismiss="offcanvas"></button></div><div class="offcanvas-body">Content</div></div>'],
["carousel / carousel-inner / carousel-item / carousel-control-* / carousel-indicators / carousel-caption / carousel-fade","Slider",'<div id="cr" class="carousel slide" data-bs-ride="carousel"><div class="carousel-inner"><div class="carousel-item active bg-primary text-white p-5 text-center">Slide 1</div><div class="carousel-item bg-success text-white p-5 text-center">Slide 2</div></div><button class="carousel-control-prev" data-bs-target="#cr" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button><button class="carousel-control-next" data-bs-target="#cr" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button></div>'],
["toast / toast-container / toast-header / toast-body","Notification popup",'<div class="toast show"><div class="toast-header"><strong class="me-auto">Title</strong><button class="btn-close" data-bs-dismiss="toast"></button></div><div class="toast-body">Hello!</div></div>'],
["tooltip (data-bs-toggle=\"tooltip\")","Hover hint (needs JS init)",'<button class="btn btn-secondary" title="Tooltip text" data-bs-toggle="tooltip">Hover me</button>'],
["popover (data-bs-toggle=\"popover\")","Click box (needs JS init)",'<button class="btn btn-danger" data-bs-toggle="popover" data-bs-content="Popover content" title="Title">Click</button>'],
["tab-content / tab-pane / fade show active","Tab panels",'<ul class="nav nav-tabs"><li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#t1">One</button></li><li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#t2">Two</button></li></ul><div class="tab-content p-2"><div class="tab-pane fade show active" id="t1">First</div><div class="tab-pane fade" id="t2">Second</div></div>'],
["scrollspy (data-bs-spy=\"scroll\")","Highlight nav on scroll",'<code>&lt;body data-bs-spy="scroll" data-bs-target="#nav"&gt;</code>'],
["btn-close / visually-hidden / stretched-link / z-*","Helpers",'<div class="card p-2 position-relative">Whole card clickable <a href="#" class="stretched-link">link</a></div>']]
};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const out=document.getElementById("out"),toc=document.getElementById("toc");let n=0;
for(const [sec,items] of Object.entries(S)){
 const id="s"+(++n);
 toc.innerHTML+=`<a class="badge bg-dark text-decoration-none me-1" href="#${id}">${sec}</a>`;
 out.innerHTML+=`<h2 class="mt-4" id="${id}">${sec}</h2>`+items.map(([c,d,h])=>`<div class="card mb-3 item"><div class="card-header"><code class="text-danger fs-6">${esc(c)}</code><div class="small text-muted">${d}</div></div><div class="card-body"><div class="row g-3"><div class="col-lg-6"><div class="demo">${h}</div></div><div class="col-lg-6"><pre>${esc(h)}</pre></div></div></div></div>`).join("");
}
document.getElementById("q").oninput=e=>{const v=e.target.value.toLowerCase();document.querySelectorAll(".item").forEach(i=>i.hidden=!i.querySelector(".card-header").textContent.toLowerCase().includes(v))};
</script>
<script src="./bootstrabfile/bootstrap.bundle.min.js"></script>
<script>
document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(e=>new bootstrap.Tooltip(e));
document.querySelectorAll('[data-bs-toggle="popover"]').forEach(e=>new bootstrap.Popover(e));
</script>
</body>
</html>
